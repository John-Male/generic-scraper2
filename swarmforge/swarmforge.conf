# swarmforge/swarmforge.conf  -- four-pack, Claude Code backend
#
# Format: window <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
#
# Roles in the four-pack: specifier -> coder -> refactorer -> architect.
# (No cleaner / hardender / QA -- those are six-pack only. The refactorer
#  absorbs cleanup, coverage, property testing, CRAP and DRY analysis.)
#
# All four run on the `claude` backend, using whichever account the
# Claude Code CLI is logged in as. There is no credential in this file.
#
# Propagation mirrors upstream's four-pack: the refactorer queues merge-only
# copies back one window, the architect back to all of them.

window specifier claude master
window coder claude coder
window refactorer claude refactorer back-one
window architect claude architect batch back-all
